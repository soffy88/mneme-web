# Mneme Web — 加入 helios-net,Cloudflare Tunnel 反代
services:
  mneme-web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_* values are build-time browser configuration.
        NEXT_PUBLIC_MNEME_ENV: ${NEXT_PUBLIC_MNEME_ENV:-production}
        NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-https://api-prod.sxueji.com}
        GIT_SHA: ${GIT_SHA:-unknown}
        RELEASE_VERSION: ${RELEASE_VERSION:-dev}
    image: mneme-web:latest
    container_name: mneme-web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_USE_MOCK: "false"
      # Aria 对话 API 密钥（服务端使用，不暴露给前端）
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
    networks:
      - helios-net
    ports:
      - "3300:3000"   # 便于主机直连自检(localhost:3300)；公网走共享边缘(aegis-caddy → sxueji.com)

networks:
  helios-net:
    external: true
